server:
  port: 0

spring:
  threads:
    virtual:
      enabled: false
  datasource:
    url: jdbc:h2:mem:gateway_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true
    schemas: security_data
    default-schema: security_data
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8080/realms/aegis-dev/protocol/openid-connect/certs

aegis:
  security:
    internal-secret: test-secret-key-for-unit-tests-32chars!
  telemetry:
    redis-stream: test:stream:api-events
    drain-interval-ms: 60000
    batch-size: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
    prometheus:
      access: unrestricted
  prometheus:
    metrics:
      export:
        enabled: true
