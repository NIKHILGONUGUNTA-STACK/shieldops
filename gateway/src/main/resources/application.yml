server:
  port: ${SERVER_PORT:8000}

spring:
  application:
    name: aegis-gateway
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/aegis}
    username: ${DB_USERNAME:aegis_owner}
    password: ${DB_PASSWORD:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    schemas: security_data
    default-schema: security_data
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8080/realms/aegis-dev/protocol/openid-connect/certs}
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/aegis-dev}
  cloud:
    gateway:
      server:
        webmvc:
          routes:
          - id: customer_service_v1
            uri: ${CUSTOMER_SERVICE_URL:http://localhost:8081}
            predicates:
              - Path=/api/v1/customers/**
            filters:
              - StripPrefix=2
          - id: customer_service
            uri: ${CUSTOMER_SERVICE_URL:http://localhost:8081}
            predicates:
              - Path=/customers/**
          - id: account_service_v1
            uri: ${ACCOUNT_SERVICE_URL:http://localhost:8082}
            predicates:
              - Path=/api/v1/accounts/**
            filters:
              - StripPrefix=2
          - id: account_service
            uri: ${ACCOUNT_SERVICE_URL:http://localhost:8082}
            predicates:
              - Path=/accounts/**
          - id: transaction_service_beneficiaries_v1
            uri: ${TRANSACTION_SERVICE_URL:http://localhost:8083}
            predicates:
              - Path=/api/v1/beneficiaries/**
            filters:
              - StripPrefix=2
          - id: transaction_service_beneficiaries
            uri: ${TRANSACTION_SERVICE_URL:http://localhost:8083}
            predicates:
              - Path=/beneficiaries/**
          - id: transaction_service_transactions_v1
            uri: ${TRANSACTION_SERVICE_URL:http://localhost:8083}
            predicates:
              - Path=/api/v1/transactions/**
            filters:
              - StripPrefix=2
          - id: transaction_service_transactions
            uri: ${TRANSACTION_SERVICE_URL:http://localhost:8083}
            predicates:
              - Path=/transactions/**
          - id: transaction_service_transfers_v1
            uri: ${TRANSACTION_SERVICE_URL:http://localhost:8083}
            predicates:
              - Path=/api/v1/transfers
            filters:
              - StripPrefix=2
          - id: transaction_service_transfers
            uri: ${TRANSACTION_SERVICE_URL:http://localhost:8083}
            predicates:
              - Path=/transfers

aegis:
  security:
    internal-secret: ${AEGIS_INTERNAL_SECRET:aegis-internal-trust-secret-key-32chars!}
  telemetry:
    redis-stream: aegis:stream:api-events
    drain-interval-ms: 2000
    batch-size: 50

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
    prometheus:
      access: unrestricted
