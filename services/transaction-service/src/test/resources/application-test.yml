spring:
  datasource:
    url: jdbc:h2:mem:transaction_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE SCHEMA IF NOT EXISTS transaction_data
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

aegis:
  security:
    internal-secret: test-secret-key-for-unit-tests-32chars!
    trust-verification:
      enabled: false

