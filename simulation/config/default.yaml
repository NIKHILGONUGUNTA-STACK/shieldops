# Aegis Simulation Default Configuration
gateway:
  base_url: "http://localhost:8000"
  timeout_seconds: 10.0
  max_retries: 2
  allow_synthetic_source_ip: false

keycloak:
  base_url: "http://localhost:8080"
  realm: "aegis-dev"
  client_id: "aegis-local"
  token_expiry_buffer_seconds: 30

downstream_health:
  customer_service_url: "http://localhost:8081"
  account_service_url: "http://localhost:8082"
  transaction_service_url: "http://localhost:8083"

execution:
  environment_id: "local-dev"
  allow_non_local: false
  max_concurrency: 5
  default_report_format: "json"
  soc_verification_timeout_seconds: 10.0
  soc_verification_interval_seconds: 0.5

benign_flow:
  transfer_amount: 25.0
  transfer_currency: "USD"
  destination_account_reference: "ACCT-00020001"
  alex_customer_id: "10000000-0000-4000-8000-000000000001"
  sam_customer_id: "10000000-0000-4000-8000-000000000002"
