openapi: 3.0.3
info:
  title: Customer Service API
  version: 1.0.0
  description: OpenAPI specification for the FinTech Customer microservice exposed via Aegis Gateway.
tags:
  - name: Customers
    description: Customer account identity and profile operations
security:
  - bearerAuth: []
paths:
  /api/v1/customers/{customerId}:
    get:
      summary: Retrieve customer details by customer ID
      description: Retrieves high-level customer record. Enforces customer-level ownership checks unless caller has SECURITY_ADMIN or SECURITY_ANALYST role.
      operationId: getCustomer
      tags:
        - Customers
      parameters:
        - name: customerId
          in: path
          required: true
          description: Unique customer UUID identifier
          schema:
            type: string
            format: uuid
            example: 11111111-1111-1111-1111-111111111111
      responses:
        '200':
          description: Customer record retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerView'
        '401':
          description: Unauthorized - Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Forbidden - Caller does not own the requested customer record
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Customer not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/customers/{customerId}/profile:
    get:
      summary: Retrieve detailed customer profile
      description: Retrieves customer profile including contact and jurisdiction details. Enforces customer-level ownership checks.
      operationId: getCustomerProfile
      tags:
        - Customers
      parameters:
        - name: customerId
          in: path
          required: true
          description: Unique customer UUID identifier
          schema:
            type: string
            format: uuid
            example: 11111111-1111-1111-1111-111111111111
      responses:
        '200':
          description: Customer profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProfile'
        '401':
          description: Unauthorized - Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Forbidden - Caller does not own the requested customer profile
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Customer profile not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak JWT access token with CUSTOMER, SECURITY_ANALYST, or SECURITY_ADMIN role
  schemas:
    CustomerView:
      type: object
      required:
        - id
        - customerNumber
        - firstName
        - lastName
        - status
        - createdDate
      properties:
        id:
          type: string
          format: uuid
          example: 11111111-1111-1111-1111-111111111111
        customerNumber:
          type: string
          example: CUST-1001
        firstName:
          type: string
          example: Jane
        lastName:
          type: string
          example: Doe
        status:
          type: string
          enum:
            - ACTIVE
            - SUSPENDED
            - CLOSED
          example: ACTIVE
        createdDate:
          type: string
          format: date
          example: '2024-01-15'
    CustomerProfile:
      type: object
      required:
        - id
        - customerNumber
        - firstName
        - lastName
        - email
        - countryCode
        - status
      properties:
        id:
          type: string
          format: uuid
          example: 11111111-1111-1111-1111-111111111111
        customerNumber:
          type: string
          example: CUST-1001
        firstName:
          type: string
          example: Jane
        lastName:
          type: string
          example: Doe
        email:
          type: string
          format: email
          example: jane.doe@example.com
        countryCode:
          type: string
          pattern: '^[A-Z]{2}$'
          example: US
        status:
          type: string
          enum:
            - ACTIVE
            - SUSPENDED
            - CLOSED
          example: ACTIVE
    ProblemDetail:
      type: object
      required:
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          example: about:blank
        title:
          type: string
          example: Not Found
        status:
          type: integer
          example: 404
        detail:
          type: string
          example: Customer not found
        instance:
          type: string
          format: uri
        timestamp:
          type: string
          format: date-time
          example: '2026-11-02T12:00:00Z'
        errors:
          type: object
          additionalProperties:
            type: string
