{{- if and .Values.secretsStoreCSI .Values.secretsStoreCSI.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "aegis.fullname" . }}-vault-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
spec:
  provider: {{ .Values.secretsStoreCSI.provider | default "vault" }}
  parameters:
    {{- if eq (.Values.secretsStoreCSI.provider | default "vault") "vault" }}
    roleName: {{ .Values.secretsStoreCSI.vault.role | default "aegis-workload" }}
    vaultAddress: {{ .Values.secretsStoreCSI.vault.address | default "https://vault.internal:8200" }}
    objects: |
      - objectName: "aegis-secrets"
        secretPath: "secret/data/aegis/production"
        secretKey: "internal-secret"
      - objectName: "db-credentials"
        secretPath: "database/creds/aegis-app"
        secretKey: "password"
      - objectName: "jwt-signing-key"
        secretPath: "secret/data/aegis/jwt"
        secretKey: "private-key"
    {{- else if eq .Values.secretsStoreCSI.provider "aws" }}
    objects: |
      - objectName: "aegis/production/credentials"
        objectType: "secretsmanager"
    {{- end }}
  secretObjects:
    - secretName: {{ include "aegis.fullname" . }}-synced-secrets
      type: Opaque
      data:
        - objectName: "aegis-secrets"
          key: AEGIS_INTERNAL_SECRET
        - objectName: "db-credentials"
          key: DB_PASSWORD
{{- end }}
