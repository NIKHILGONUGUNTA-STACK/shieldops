apiVersion: v1
kind: Pod
metadata:
  name: {{ include "aegis.fullname" . }}-test-gateway-health
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
  containers:
    - name: wget-health
      image: "{{ .Values.global.imageRegistry }}/curlimages/curl:8.10.1"
      imagePullPolicy: IfNotPresent
      command:
        - "sh"
        - "-c"
        - "curl --fail --silent --show-error --connect-timeout 5 --max-time 10 http://{{ include "aegis.fullname" . }}-gateway:{{ .Values.gateway.service.port }}/actuator/health/readiness || exit 1"
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
