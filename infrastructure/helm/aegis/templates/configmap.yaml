apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aegis.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
data:
  CUSTOMER_SERVICE_URL: "http://{{ include "aegis.fullname" . }}-customer:8081"
  ACCOUNT_SERVICE_URL: "http://{{ include "aegis.fullname" . }}-account:8082"
  TRANSACTION_SERVICE_URL: "http://{{ include "aegis.fullname" . }}-transaction:8083"
  KEYCLOAK_JWKS_URI: "http://{{ .Values.keycloak.host }}:{{ .Values.keycloak.port }}/realms/aegis-dev/protocol/openid-connect/certs"
  KEYCLOAK_ISSUER_URI: "http://{{ .Values.keycloak.host }}:{{ .Values.keycloak.port }}/realms/aegis-dev"
  DB_URL: "jdbc:postgresql://{{ .Values.postgresql.host }}:{{ .Values.postgresql.port }}/{{ .Values.postgresql.database }}"
  DB_USERNAME: {{ .Values.postgresql.username | quote }}
  REDIS_HOST: {{ .Values.redis.host | quote }}
  REDIS_PORT: {{ .Values.redis.port | quote }}
  AEGIS_TRUST_VERIFICATION_ENABLED: "true"
  AEGIS_SEED_BASELINE_ENABLED: "true"
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75 -XX:+UseG1GC -Djava.security.egd=file:/dev/./urandom"
