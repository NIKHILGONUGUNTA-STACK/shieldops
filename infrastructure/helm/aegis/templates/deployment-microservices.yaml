{{- range $name, $svc := .Values.microservices }}
{{- if (hasKey $svc "port") }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aegis.fullname" $ }}-{{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "aegis.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: {{ $svc.replicaCount }}
  selector:
    matchLabels:
      {{- include "aegis.selectorLabels" $name | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "aegis.selectorLabels" $name | nindent 8 }}
    spec:
      serviceAccountName: {{ $.Values.serviceAccount.name }}
      securityContext:
        {{- toYaml $.Values.securityContext.pod | nindent 8 }}
      containers:
        - name: {{ $name }}-service
          image: "{{ $svc.image.repository }}:{{ $svc.image.tag }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- toYaml $.Values.securityContext.container | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
              protocol: TCP
          env:
            - name: SERVER_PORT
              value: {{ $svc.port | quote }}
          envFrom:
            - configMapRef:
                name: {{ include "aegis.fullname" $ }}-config
            - secretRef:
                name: {{ include "aegis.fullname" $ }}-secrets
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 25
            periodSeconds: 10
            timeoutSeconds: 5
{{- end }}
{{- end }}
