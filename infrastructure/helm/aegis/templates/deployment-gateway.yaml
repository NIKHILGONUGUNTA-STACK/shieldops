apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aegis.fullname" . }}-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  {{- if not .Values.gateway.autoscaling.enabled }}
  replicas: {{ .Values.gateway.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "aegis.selectorLabels" "gateway" | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "aegis.selectorLabels" "gateway" | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        {{- toYaml .Values.securityContext.pod | nindent 8 }}
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext.container | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.gateway.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "aegis.fullname" . }}-config
            - secretRef:
                name: {{ include "aegis.fullname" . }}-secrets
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.gateway.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.gateway.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.gateway.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.gateway.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.gateway.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.gateway.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.gateway.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.gateway.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.gateway.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.gateway.probes.readiness.failureThreshold }}
